[project]
name = "kanzlei-ai"
version = "0.1.0"
description = "Independent document and email AI service for Kanzlei ERP"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "qdrant-client>=1.14,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
documents = ["docling>=2,<3", "torch>=2.2,<3", "torchvision>=0.17,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires the isolated AI PostgreSQL, Qdrant and Redis stack"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
