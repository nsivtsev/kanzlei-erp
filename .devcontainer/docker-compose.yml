# Based on frappe/frappe_docker devcontainer-example/docker-compose.yml
# upstream revision: 48a34e5f1620c2f71253d70af21da14c9c931ea8
name: kanzlei-erp

services:
  mariadb:
    image: docker.io/mariadb:11.8
    platform: linux/arm64
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Create .env with scripts/setup-local.sh}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/redis:alpine
    platform: linux/arm64

  redis-queue:
    image: docker.io/redis:alpine
    platform: linux/arm64

  frappe:
    image: docker.io/frappe/bench:latest
    platform: linux/arm64
    command: >-
      bash -lc 'until test -f /workspace/development/frappe-bench/.kanzlei-ready;
      do sleep 2; done;
      cd /workspace/development/frappe-bench && exec bench start'
    environment:
      SHELL: /bin/bash
      FRAPPE_BIND_ADDR: 0.0.0.0
      LOCAL_DB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Create .env with scripts/setup-local.sh}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Create .env with scripts/setup-local.sh}
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace/development
    ports:
      - "127.0.0.1:8100:8000"
      - "127.0.0.1:9100:9100"
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

volumes:
  mariadb-data:
