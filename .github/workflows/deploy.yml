name: Release and deploy
run-name: Deploy ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) reachable from main
        required: true
        type: string

permissions:
  contents: read

# Queue releases; never interrupt a running backup or migration.
concurrency:
  group: production-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      image: ${{ steps.promote.outputs.image }}
      revision: ${{ steps.resolve.outputs.revision }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # The controller comes from main; the deployment payload comes from the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Resolve the image verified by CI main
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_release.py resolve "$RELEASE_TAG"
      - name: Promote the verified manifest without transferring image layers
        if: steps.resolve.outputs.ready == 'true'
        id: promote
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          REVISION: ${{ steps.resolve.outputs.revision }}
          VERIFIED_IMAGE: ${{ steps.resolve.outputs.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_release.py promote "$RELEASE_TAG" "$REVISION" "$VERIFIED_IMAGE"
      - name: Package matching deployment configuration
        if: steps.resolve.outputs.ready == 'true'
        env:
          REVISION: ${{ steps.resolve.outputs.revision }}
        run: git archive --format=tar "$REVISION" deploy | gzip > release.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.resolve.outputs.ready == 'true'
        with:
          name: deployment-release
          overwrite: true
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: release
    if: needs.release.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-release
      - name: Deploy verified image over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/kanzlei-erp' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ needs.release.outputs.image }}
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/deploy-ssh.sh
      - name: Deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
          RELEASE_IMAGE: ${{ needs.release.outputs.image }}
        run: |
          # Markdown backticks are literal.
          # shellcheck disable=SC2016
          printf '### Production deployment\n\nResult: `%s`\n\nTag: `%s`\n\nCommit: `%s`\n\nImage: `%s`\n\nBackup path and recovery state are printed in the deployment log.\n' "$DEPLOY_STATUS" "$RELEASE_TAG" "$RELEASE_REVISION" "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
