name: Release and deploy
run-name: Deploy ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) reachable from main
        required: true
        type: string

permissions:
  contents: read

# Queue releases; never interrupt a running backup or migration.
concurrency:
  group: production-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      revision: ${{ steps.validate.outputs.revision }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release tag and main ancestry
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! $RELEASE_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z" >&2
            exit 1
          fi
          revision=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$revision"
          git merge-base --is-ancestor "$revision" origin/main
          printf 'revision=%s\ntag=%s\n' "$revision" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Deployment tests and shell checks
        run: |
          python3 -m unittest discover -s tests/deploy -v
          bash -n scripts/bootstrap-production.sh scripts/build-production-image.sh scripts/ci-image.sh scripts/deploy-ssh.sh
          shellcheck scripts/bootstrap-production.sh scripts/build-production-image.sh scripts/ci-image.sh scripts/deploy-ssh.sh
          # actionlint 1.7.12 predates GitHub concurrency.queue (May 2026).
          # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -ignore '^unexpected key "queue" for "concurrency" section\.'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing immutable release
        id: existing
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_ref=$(python3 scripts/release-image.py "$RELEASE_TAG")
          printf 'image=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
      - name: Pull the previously verified release for a retry
        if: steps.existing.outputs.image != ''
        env:
          EXISTING_IMAGE: ${{ steps.existing.outputs.image }}
          REVISION: ${{ steps.validate.outputs.revision }}
        run: |
          docker pull --platform linux/amd64 "$EXISTING_IMAGE"
          actual=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$EXISTING_IMAGE")
          test "$actual" = "$REVISION"
          docker tag "$EXISTING_IMAGE" kanzlei-release:test
      - name: Build exact commit for a new release
        if: steps.existing.outputs.image == ''
        run: bash scripts/build-production-image.sh kanzlei-release:test
      - name: Verify application and backup restore
        run: bash scripts/ci-image.sh kanzlei-release:test
      - name: Publish the verified image without rebuilding
        id: publish
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          REVISION: ${{ steps.validate.outputs.revision }}
          EXISTING_IMAGE: ${{ steps.existing.outputs.image }}
        run: |
          image=ghcr.io/nsivtsev/kanzlei-erp
          if [[ -n $EXISTING_IMAGE ]]; then
            image_ref=$EXISTING_IMAGE
          else
            docker tag kanzlei-release:test "$image:$RELEASE_TAG"
            docker push "$image:$RELEASE_TAG"
            image_ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$RELEASE_TAG" | awk -v prefix="$image@sha256:" 'index($0,prefix)==1 {print; exit}')
          fi
          if [[ ! $image_ref =~ ^ghcr\.io/nsivtsev/kanzlei-erp@sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not determine the published digest" >&2
            exit 1
          fi
          printf 'image=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          # Markdown backticks are literal.
          # shellcheck disable=SC2016
          printf '### Verified release\n\nTag: `%s`\n\nCommit: `%s`\n\nImage: `%s`\n' "$RELEASE_TAG" "$REVISION" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Package matching deployment configuration
        run: tar -czf release.tar.gz deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-release
          path: release.tar.gz
          retention-days: 7

  deploy:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-release
      - name: Deploy verified image over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/kanzlei-erp' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ needs.release.outputs.image }}
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/deploy-ssh.sh
      - name: Deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
          RELEASE_IMAGE: ${{ needs.release.outputs.image }}
        run: |
          # Markdown backticks are literal.
          # shellcheck disable=SC2016
          printf '### Production deployment\n\nResult: `%s`\n\nTag: `%s`\n\nCommit: `%s`\n\nImage: `%s`\n\nBackup path and recovery state are printed in the deployment log.\n' "$DEPLOY_STATUS" "$RELEASE_TAG" "$RELEASE_REVISION" "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
