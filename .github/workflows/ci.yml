name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Deployment tests and shell checks
        run: |
          python3 -m unittest discover -s tests/deploy -v
          bash -n scripts/bootstrap-production.sh scripts/build-production-image.sh scripts/ci-image.sh scripts/deploy-ssh.sh
          shellcheck scripts/bootstrap-production.sh scripts/build-production-image.sh scripts/ci-image.sh scripts/deploy-ssh.sh
          # actionlint 1.7.12 predates GitHub concurrency.queue (May 2026).
          # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -ignore '^unexpected key "queue" for "concurrency" section\.'
      - name: Build exact commit
        run: bash scripts/build-production-image.sh kanzlei-ci:test
      - name: Verify application and backup restore
        run: bash scripts/ci-image.sh kanzlei-ci:test
