name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/verify.yml
    with:
      publish: false
    permissions:
      contents: read

  verify-main:
    if: github.event_name == 'push'
    concurrency:
      group: ci-main
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/verify.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
