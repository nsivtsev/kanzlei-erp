<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posteingang Vorschlag</title>
<style>
/* Synthetic mockup of the one-click Posteingang. Fixed ERP palette is scoped to .pe. */
body{margin:0;background:var(--background,#f6f7f9);color:var(--foreground,#18232f);font-family:var(--font-sans,Inter,system-ui,-apple-system,"Segoe UI",sans-serif)}
.pe{--c-canvas:#f6f7f9;--c-surface:#fff;--c-text:#18232f;--c-muted:#566575;--c-line:#e3e7ec;--c-soft:#eef1f5;
 --c-primary:#2454d7;--c-primary-ink:#fff;--c-primary-soft:#eaf0fd;--c-pos:#236447;--c-pos-soft:#e7f4ec;
 --c-att:#85530a;--c-att-soft:#fdf3e1;--c-att-line:#e8c27a;--c-neg:#b42318;--c-neg-soft:#fdecea;--c-mark:#fff1a8;
 container-type:inline-size;background:var(--c-canvas);color:var(--c-text);font-size:14px;line-height:1.5;border-radius:12px;overflow:hidden;border:1px solid var(--c-line)}
.pe *{box-sizing:border-box}
.pe button{font:inherit;cursor:pointer}
.pe :focus-visible{outline:2px solid var(--c-primary);outline-offset:2px}
.pe svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.pe-top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--c-surface);border-bottom:1px solid var(--c-line)}
.pe-top h1{font-size:20px;line-height:1.2;margin:0;font-weight:650}
.pe-top .sub{color:var(--c-muted);font-size:13px}
.pe-top .grow{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--c-line);background:var(--c-surface);color:var(--c-text);font-weight:550;transition:background .15s,border-color .15s}
.btn:hover{background:var(--c-soft)}
.btn-primary{background:var(--c-primary);border-color:var(--c-primary);color:var(--c-primary-ink)}
.btn-primary:hover{background:#1d46b8}
.btn-link{border:0;background:none;color:var(--c-primary);padding:0;min-height:0;font-weight:550}
.btn-link:hover{background:none;text-decoration:underline}
.btn-lg{min-height:44px;padding:0 20px;font-size:15px}

/* layout */
.pe-body{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:640px}
.pe-body.with-pdf{grid-template-columns:260px minmax(0,1fr) minmax(0,1fr)}
.pe-rail{background:var(--c-surface);border-right:1px solid var(--c-line);padding:12px;display:flex;flex-direction:column;gap:6px}
.pe-main{padding:20px;min-width:0}
.pe-pdf{border-left:1px solid var(--c-line);background:#e9ecf0;padding:16px;min-width:0;display:none}
.with-pdf .pe-pdf{display:block}

/* drop zone */
.drop{border:1.5px dashed #b8c2cf;border-radius:10px;padding:14px 12px;text-align:center;color:var(--c-muted);background:var(--c-canvas);margin-bottom:8px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--c-primary);background:var(--c-primary-soft)}
.drop strong{display:block;color:var(--c-text);font-weight:600;margin-bottom:2px}
.drop .btn{margin-top:8px;width:100%}
.rail-h{font-size:12px;font-weight:600;color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 6px 2px}

/* list items */
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:9px 10px;color:var(--c-text)}
.item:hover{background:var(--c-soft)}
.item[aria-current="true"]{background:var(--c-primary-soft);border-color:#c9d6f7}
.item .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--c-muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:4px}
.chip svg{width:12px;height:12px}
.chip.ready{background:var(--c-primary-soft);color:var(--c-primary)}
.chip.need{background:var(--c-att-soft);color:var(--c-att)}
.chip.busy{background:var(--c-soft);color:var(--c-muted)}
.chip.fail{background:var(--c-neg-soft);color:var(--c-neg)}
.chip.done{background:var(--c-pos-soft);color:var(--c-pos)}

/* card */
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:12px;max-width:720px;margin:0 auto;overflow:hidden}
.card-head{padding:20px 24px 16px;border-bottom:1px solid var(--c-line)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--c-muted);font-size:13px;align-items:center}
.meta .dot{width:3px;height:3px;border-radius:50%;background:#a3adb9}
.card-head h2{font-size:20px;line-height:1.3;margin:6px 0 6px;font-weight:650}
.card-head p{margin:0;color:var(--c-muted)}
.head-row{display:flex;gap:12px;align-items:flex-start}
.head-row .grow{flex:1;min-width:0}
.sec{padding:16px 24px;border-bottom:1px solid var(--c-line)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.sec-h .grow{flex:1}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:36px;height:36px;border-radius:8px;background:var(--c-soft);display:grid;place-items:center;font-weight:650;color:var(--c-muted);flex:none}
.who b{font-size:15px;display:block}
.why{font-size:13px;color:var(--c-muted)}
.src{display:inline-flex;align-items:center;gap:4px;font-size:13px}

.need-box{border:1px solid var(--c-att-line);background:var(--c-att-soft);border-radius:10px;padding:12px 14px}
.need-box.flash{animation:flash .6s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 3px rgba(232,194,122,.6)}}
.need-box .lbl{font-weight:600;color:var(--c-att);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--c-line);border-radius:8px;background:var(--c-surface);margin-top:6px;cursor:pointer}
.opt:hover{border-color:#b8c2cf}
.opt input{margin-top:3px;accent-color:var(--c-primary)}
.opt.sel{border-color:var(--c-primary);box-shadow:0 0 0 1px var(--c-primary)}

.task{border:1px solid var(--c-line);border-radius:10px;padding:14px 16px}
.task+.task{margin-top:10px}
.task.off{opacity:.55}
.task-top{display:flex;gap:10px;align-items:flex-start}
.task-top input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--c-primary)}
.task-top b{font-size:15px}
.task-top p{margin:2px 0 0;color:var(--c-muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.fact{background:var(--c-canvas);border-radius:8px;padding:10px 12px;min-width:0}
.fact .k{font-size:12px;color:var(--c-muted);display:flex;align-items:center;gap:5px}
.fact .v{font-weight:600;font-size:15px;margin-top:2px}
.fact .h{font-size:12px;color:var(--c-muted);margin-top:2px}
.fact.legal{background:#fff;border:1px solid var(--c-line)}
.quote{margin-top:10px;font-size:13px;color:var(--c-muted);border-left:3px solid var(--c-line);padding:2px 0 2px 10px}
.quote q{color:var(--c-text);font-style:italic}

.foot{padding:16px 24px 20px;background:var(--c-surface)}
.foot-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot-note{font-size:13px;color:var(--c-muted);margin-top:10px}
.foot-err{font-size:13px;color:var(--c-att);font-weight:600;margin-top:10px;display:flex;gap:6px;align-items:center}

/* form (manual) */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.field .hint{font-size:12px;color:var(--c-muted);margin-top:4px}
.field input,.field select,.field textarea{width:100%;min-height:40px;border:1px solid #cdd4dd;border-radius:8px;padding:8px 10px;font:inherit;color:var(--c-text);background:#fff}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--c-primary);outline-offset:0;border-color:var(--c-primary)}

/* states */
.state{padding:28px 24px;text-align:center}
.state .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}
.state .ico svg{width:22px;height:22px}
.state h3{margin:0 0 6px;font-size:18px}
.state p{margin:0 auto;color:var(--c-muted);max-width:440px}
.ok .ico{background:var(--c-pos-soft);color:var(--c-pos)}
.bad .ico{background:var(--c-neg-soft);color:var(--c-neg)}
.created{text-align:left;max-width:520px;margin:16px auto 0;border:1px solid var(--c-line);border-radius:10px}
.created a{display:flex;gap:10px;align-items:center;padding:10px 14px;color:var(--c-text);text-decoration:none;border-bottom:1px solid var(--c-line)}
.created a:last-child{border-bottom:0}
.created a:hover{background:var(--c-soft)}
.created small{color:var(--c-muted);display:block}
.sk{background:linear-gradient(90deg,#eef1f5 25%,#e3e7ec 50%,#eef1f5 75%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:6px;height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* pdf */
.pdf-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--c-muted)}
.pdf-bar .grow{flex:1}
.paper{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:28px 30px;font-family:Georgia,"Times New Roman",serif;font-size:13px;line-height:1.55;color:#222;margin-bottom:14px}
.paper .from{font-family:var(--font-sans,system-ui);font-weight:700;font-size:12px;letter-spacing:.03em;color:#334}
.paper .addr{margin:14px 0;font-size:12px}
.paper .pg{font-family:system-ui;font-size:11px;color:#888;text-align:right;margin-top:14px}
.paper mark{background:var(--c-mark);padding:0 2px;border-radius:2px}
.paper mark.pulse{animation:pulse .7s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px #ffd84d}}
.paper.blurred{filter:blur(1.6px) contrast(.7);opacity:.75}
.back-pdf{display:none}

/* toast */
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#18232f;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:14px;white-space:nowrap}
.toast .btn-link{color:#9fbaff}
.pe-wrap{position:relative}

  .back-list{display:none;margin-bottom:10px}
/* responsive: PDF overlays the card below 1100px, list collapses below 680px */
@container (max-width:1099px){
 .pe-body.with-pdf{grid-template-columns:260px minmax(0,1fr)}
 .with-pdf .pe-main{display:none}
 .with-pdf .pe-pdf{border-left:0}
 .with-pdf .back-pdf{display:inline-flex}
}
@container (max-width:679px){
 .pe-body,.pe-body.with-pdf{grid-template-columns:1fr}
 .pe-rail{border-right:0;border-bottom:1px solid var(--c-line)}
 .pe-body.focus .pe-rail{display:none}
 .pe-body:not(.focus) .pe-main,.pe-body:not(.focus) .pe-pdf{display:none}
 .pe-main{padding:12px}
 .card-head,.sec,.foot{padding-left:16px;padding-right:16px}
 .facts,.form{grid-template-columns:1fr}
 .pe-top{padding:12px 16px}
 .back-list{display:inline-flex}
 .foot-row .btn{flex:1 1 100%}
 .head-row{flex-direction:column-reverse}
}
@media (prefers-reduced-motion:reduce){.pe *{animation:none!important;transition:none!important}}
</style>
</head>

 const miss=missing(d);
 if(miss.length) return `<span class="chip need">${ic('alert')}${miss.length===1?'1 Angabe fehlt':miss.length+' Angaben fehlen'}</span>`;
 return `<span class="chip ready">${ic('check')}Vorschlag bereit</span>`;
};
function missing(d){
 const s=S(d.id),m=[];
 if(d.candidates&&s.cand==null) m.push({key:'mandant',text:'Mandant auswählen'});
 d.tasks.forEach((t,i)=>{if(t.on&&t.fristKind==='relative'&&!s.frist)m.push({key:'frist'+i,text:'Frist aus dem Schreiben eintragen'})});
 return m;
}
function rail(){
 const open=docs.filter(d=>S(d.id).mode!=='done'&&d.kind!=='done'),done=docs.filter(d=>S(d.id).mode==='done'||d.kind==='done');
 const li=d=>`<button class="item" data-sel="${d.id}" aria-current="${d.id===sel}"><span class="t">${esc(d.sender)}</span><span class="s">${esc(d.type)}</span>${chip(d)}</button>`;
 return `<aside class="pe-rail" aria-label="Dokumente">
  <div class="drop" id="drop"><strong>PDF hier ablegen</strong>oder<button class="btn btn-primary" data-act="upload">${ic('up')}PDF auswählen</button></div>
  <div class="rail-h">Offen · ${open.length}</div>${open.map(li).join('')}
  <div class="rail-h">Erledigt</div>${done.map(li).join('')}</aside>`;
}
function head(d){
 return `<div class="card-head"><div class="head-row"><div class="grow">
  <div class="meta"><span>${esc(d.sender)}</span><span class="dot"></span><span>${esc(d.type)}</span><span class="dot"></span><span>Eingang: unbekannt <button class="btn-link" data-act="noop">ändern</button></span></div>
  <h2>${esc(d.title)}</h2><p>${esc(d.summary)}</p></div>
  <button class="btn" data-act="pdf" aria-pressed="${pdf}">${ic('eye')}${pdf?'Original ausblenden':'Original'}</button></div></div>`;
}
function mandantSec(d){
 const s=S(d.id);
 if(d.candidates){
  return `<div class="sec"><div class="sec-h">Mandant</div><div class="need-box" id="f-mandant"><div class="lbl">${ic('alert')}Bitte Mandant wählen: zwei passen zum Schreiben</div>
  ${d.candidates.map((c,i)=>`<label class="opt ${s.cand===i?'sel':''}"><input type="radio" name="cand" data-cand="${i}" ${s.cand===i?'checked':''}><span><b>${esc(c.name)}</b><span class="why" style="display:block">${esc(c.why)}</span></span></label>`).join('')}
  <div style="margin-top:8px"><button class="btn-link" data-act="noop">Anderen Mandanten suchen</button></div></div></div>`;
 }
 const m=d.mandant;
 return `<div class="sec"><div class="sec-h">Mandant</div><div class="who"><div class="avatar">${m.ini}</div><div><b>${esc(m.name)}</b><span class="why">${esc(m.why)} · <button class="btn-link src" data-q="${m.page}">S. ${m.page}</button></span></div></div></div>`;
}
function taskCard(d,t,i,multi){
 const s=S(d.id);
 let frist;
 if(t.fristKind==='explicit') frist=`<div class="fact legal"><div class="k">${ic('flag')}Frist laut Schreiben</div><div class="v">${t.frist}</div><div class="h"><button class="btn-link src" data-q="${t.page}">S. ${t.page} ansehen</button></div></div>`;
 else if(t.fristKind==='relative') frist=`<div class="fact ${/^\d{2}\.\d{2}\.\d{4}$/.test(s.frist)?'legal':'need-box'}" id="f-frist${i}" style="padding:10px 12px"><div class="k">${ic('flag')}Frist selbst eintragen</div><div class="field" style="margin-top:4px"><input type="text" inputmode="numeric" placeholder="TT.MM.JJJJ" aria-label="Frist aus dem Schreiben" data-frist value="${esc(s.frist)}"></div><div class="h">Wird nicht berechnet</div></div>`;
 else frist=`<div class="fact"><div class="k">${ic('flag')}Frist laut Schreiben</div><div class="v">keine</div><div class="h">nicht genannt</div></div>`;
 const okF=/^\d{2}\.\d{2}\.\d{4}$/.test(s.frist);
 const termin=t.fristKind==='relative'?(okF?minusWorkdays(s.frist,5):'–'):t.termin;
 return `<div class="task ${t.on?'':'off'}"><div class="task-top">${multi?`<input type="checkbox" data-on="${i}" ${t.on?'checked':''} aria-label="${esc(t.title)} übernehmen">`:''}<div><b>${esc(t.title)}</b><p>${esc(t.desc)}</p></div></div>
  <div class="facts">${frist}
  <div class="fact"><div class="k">${ic('cal')}Arbeitstermin</div><div class="v">${termin}</div><div class="h">${t.terminWhy}</div></div>
  <div class="fact"><div class="k">${ic('user')}Zuständig</div><div class="v">Ich</div><div class="h">hat hochgeladen</div></div></div>
  ${t.quote?`<div class="quote">Im Schreiben: <q>${esc(t.quote)}</q></div>`:''}</div>`;
}
function proposal(d){
 const s=S(d.id),on=d.tasks.filter(t=>t.on),miss=missing(d);
 const mName=d.candidates?(s.cand!=null?d.candidates[s.cand].name:'den gewählten Mandanten'):d.mandant.name;
 let tasksSec,primary,note;
 if(d.kind==='none'){
  tasksSec=`<div class="sec"><div class="sec-h">Aufgaben</div><div class="task"><div class="task-top"><div><b>Keine Aufgabe nötig</b><p>${esc(d.noneWhy)} <button class="btn-link src" data-q="1">S. 1</button></p></div></div></div></div>`;
  primary=`${ic('archive')}Ohne Aufgabe ablegen`;note=`Das Schreiben wird bei ${esc(mName)} unter Dokumente abgelegt.`;
 }else{
  const multi=d.tasks.length>1;
  tasksSec=`<div class="sec"><div class="sec-h"><span class="grow">${multi?`Aufgaben · ${on.length} von ${d.tasks.length} ausgewählt`:'Aufgabe'}</span></div>${d.tasks.map((t,i)=>taskCard(d,t,i,multi)).join('')}</div>`;
  primary=on.length?`${ic('check')}${on.length>1?on.length+' Aufgaben übernehmen':'Übernehmen'}`:`${ic('archive')}Ohne Aufgabe ablegen`;
  note=on.length?`Erstellt ${on.length===1?'1 Aufgabe':on.length+' Aufgaben'} für ${esc(mName)}. Mit „Übernehmen“ bestätigen Sie Mandant, Frist und Aufgabe.`:`Keine Aufgabe ausgewählt. Das Schreiben wird nur abgelegt.`;
 }
 const err=s.err&&miss.length?`<div class="foot-err" role="alert">${ic('alert')}Noch offen: ${miss.map(m=>`<button class="btn-link" data-jump="${m.key}">${m.text}</button>`).join(', ')}</div>`:'';
 return `<section class="card" aria-label="Vorschlag">${head(d)}<div class="sec" style="padding-top:12px;padding-bottom:12px;background:var(--c-canvas)"><span class="why">Vorschlag des Assistenten · bitte kurz mit dem Original vergleichen</span></div>
  ${mandantSec(d)}${tasksSec}
  <div class="foot"><div class="foot-row"><button class="btn btn-primary btn-lg" data-act="accept">${primary}</button><button class="btn btn-lg" data-act="manual">${ic('edit')}Manuell erstellen</button></div>${err}<div class="foot-note">${note}</div></div></section>`;
}
function manual(d){
 const f=S(d.id).form??={};const t0=d.tasks[0]||{};const t={title:f['m-t']??t0.title,desc:f['m-d']??t0.desc,frist:f['m-f']??t0.frist,termin:f['m-a']??t0.termin};const m=f['m-m']??(d.mandant?.name||(d.candidates&&S(d.id).cand!=null?d.candidates[S(d.id).cand].name:''));
 const opts=['','Beispiel Handwerk GmbH','Schmidt Bau GmbH','Schmidt Immobilien GbR','Anna Beispiel'];
 return `<section class="card" aria-label="Manuell erstellen">${head(d)}
 <div class="sec"><div class="sec-h">Aufgabe manuell erstellen${d.tasks.length?' · aus dem Vorschlag vorausgefüllt':''}</div>
 <div class="form">
  <div class="field full"><label for="m-m">Mandant</label><select id="m-m">${opts.map(o=>`<option value="${o}" ${o===m?'selected':''}>${o||'Bitte wählen'}</option>`).join('')}</select></div>
  <div class="field full"><label for="m-t">Aufgabe</label><input id="m-t" value="${esc(t.title||'')}" placeholder="z. B. Bescheid prüfen"></div>
  <div class="field full"><label for="m-d">Beschreibung <span class="why">(optional)</span></label><textarea id="m-d">${esc(t.desc||'')}</textarea></div>
  <div class="field"><label for="m-f">Frist laut Schreiben <span class="why">(optional)</span></label><input id="m-f" value="${esc(t.frist||S(d.id).frist||'')}" placeholder="TT.MM.JJJJ"><div class="hint">Nur ein Datum, das im Schreiben steht</div></div>
  <div class="field"><label for="m-a">Arbeitstermin</label><input id="m-a" value="${esc(t.termin||'')}" placeholder="TT.MM.JJJJ"><div class="hint">Wann die Kanzlei daran arbeitet</div></div>
  <div class="field"><label for="m-z">Zuständig</label><select id="m-z">${['Ich','Mitarbeiter A','Mitarbeiter B'].map(o=>`<option ${o===(f['m-z']??'Ich')?'selected':''}>${o}</option>`).join('')}</select></div>
 </div>
 <div style="margin-top:12px"><button class="btn-link" data-act="noop">+ Weitere Aufgabe</button></div></div>
 <div class="foot"><div class="foot-row"><button class="btn btn-primary btn-lg" data-act="create">${ic('check')}Aufgabe erstellen</button><button class="btn btn-lg" data-act="cancel">Abbrechen</button><span style="flex:1"></span><button class="btn-link" data-act="archive">Ohne Aufgabe ablegen</button></div></div></section>`;
}
function analyzing(d){
 return `<section class="card" aria-busy="true">${head({...d,title:d.sender,summary:'Der Assistent liest das Schreiben …'})}
 <div class="sec"><div class="sec-h">Mandant</div><div class="sk" style="width:45%"></div><div class="sk" style="width:30%"></div></div>
 <div class="sec"><div class="sec-h">Aufgabe</div><div class="sk" style="width:70%"></div><div class="sk" style="width:90%"></div><div class="sk" style="width:60%"></div></div>
 <div class="foot"><div class="foot-note" role="status">${ic('spin','spin')} Meist unter einer Minute. Sie können inzwischen andere Dokumente bearbeiten.</div></div></section>`;
}
function failed(d){
 return `<section class="card">${head({...d,summary:''})}<div class="state bad"><div class="ico">${ic('alert')}</div><h3>Automatische Analyse fehlgeschlagen</h3><p>Das Schreiben ist kaum lesbar. Bitte prüfen Sie das Original und erstellen Sie die Aufgabe selbst. Das heißt nicht, dass keine Aufgabe nötig ist.</p>
 <div class="foot-row" style="justify-content:center;margin-top:16px"><button class="btn btn-primary btn-lg" data-act="manual">${ic('edit')}Manuell erstellen</button><button class="btn btn-lg" data-act="retry">${ic('redo')}Erneut analysieren</button></div></div></section>`;
}
function done(d){
 const s=S(d.id),list=s.created||(d.doneTasks||[]).map(t=>({title:t,sub:d.mandantName}));
 const next=docs.find(x=>x.id!==d.id&&S(x.id).mode!=='done'&&x.kind!=='done'&&x.kind!=='analyzing');
 return `<section class="card">${head({...d,summary:''})}<div class="state ok"><div class="ico">${ic('check')}</div><h3>${list.length?(list.length===1?'1 Aufgabe erstellt':list.length+' Aufgaben erstellt'):'Ohne Aufgabe abgelegt'}</h3><p>Das Original ist beim Mandanten unter Dokumente abgelegt.</p>
 ${list.length?`<div class="created">${list.map(t=>`<a href="#" data-act="noop">${ic('link')}<span><b>${esc(t.title)}</b><small>${esc(t.sub)}</small></span></a>`).join('')}</div>`:''}
 <div class="foot-row" style="justify-content:center;margin-top:16px">${next?`<button class="btn btn-primary btn-lg" data-next="${next.id}">Nächstes Dokument</button>`:''}${s.undo?`<button class="btn btn-lg" data-act="undo">Rückgängig</button>`:''}</div></div></section>`;
}
function pdfPane(d){
 return `<aside class="pe-pdf" aria-label="Original"><div class="pdf-bar"><button class="btn back-pdf" data-act="pdf">${ic('back')}Zurück zum Vorschlag</button><span class="grow">${esc(d.sender)} · ${d.pages.length} ${d.pages.length>1?'Seiten':'Seite'}</span></div>
 ${d.pages.map((p,i)=>`<div class="paper ${d.blur?'blurred':''}" id="pg${i+1}">${p}<div class="pg">Seite ${i+1} von ${d.pages.length}</div></div>`).join('')}</aside>`;
}
function render(){
 const d=docs.find(x=>x.id===sel),s=S(d.id);
 let main=d.kind==='analyzing'?analyzing(d):d.kind==='failed'&&s.mode!=='manual'&&s.mode!=='done'?failed(d):s.mode==='manual'?manual(d):s.mode==='done'?done(d):proposal(d);
 app.innerHTML=`<header class="pe-top"><div class="grow"><h1>Posteingang</h1><div class="sub">PDF hochladen, Vorschlag prüfen, übernehmen.</div></div></header>
 <div class="pe-body ${pdf?'with-pdf':''} ${focus?'focus':''}">${rail()}<main class="pe-main"><button class="btn back-list" data-act="list">${ic('back')}Alle Dokumente</button>${main}</main>${pdfPane(d)}</div>
 ${toastT?`<div class="toast" role="status" aria-live="polite">${toastT}</div>`:''}`;
 bindDrop();
}
function toast(html,id=null){toastT=html;toastId=id;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{toastT=null;render()},5000)}
function upload(){
 const d={id:seq++,sender:'Neues Schreiben.pdf',type:'Hochgeladen gerade eben',title:'',kind:'analyzing',summary:'',tasks:[],pages:['<div class="from">BERUFSGENOSSENSCHAFT BEISPIEL</div><p><b>Beitragsbescheid 2026</b></p><p>Der Beitrag ist <mark data-q="1">bis zum 15.01.2027</mark> zu zahlen.</p>']};
 docs.unshift(d);sel=d.id;focus=true;render();
 setTimeout(()=>{Object.assign(d,{kind:'ready',sender:'Berufsgenossenschaft Beispiel',type:'Beitragsbescheid 2026',title:'BG-Beitrag 2026 zahlen',summary:'Beitragsbescheid über 512,40 € für das Jahr 2026.',
  mandant:{name:'Schmidt Bau GmbH',ini:'SB',why:'Mitgliedsnummer 98765 im Schreiben',page:1},
  tasks:[{title:'BG-Beitrag 2026 zahlen',desc:'512,40 € überweisen.',frist:'15.01.2027',fristKind:'explicit',quote:'bis zum 15.01.2027',page:1,termin:'08.01.2027',terminWhy:'5 Arbeitstage vor Frist',on:true}]});render();},2600);
}
function jumpTo(key){const el=document.getElementById('f-'+key);if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');(el.querySelector('input')||el).focus?.()}
app.addEventListener('click',e=>{
 const b=e.target.closest('button,a,[data-cand],[data-on]');if(!b)return;
 const d=docs.find(x=>x.id===sel),s=S(d.id);
 if(b.dataset.sel){sel=+b.dataset.sel;focus=true;render();return}
 if(b.dataset.next){sel=+b.dataset.next;render();return}
 if(b.dataset.jump){jumpTo(b.dataset.jump);return}
 if(b.dataset.q){if(!pdf){pdf=true;render()}const m=document.querySelector(`#pg${b.dataset.q} mark`)||document.querySelector('.pe-pdf mark');if(m){m.scrollIntoView({block:'center',behavior:'smooth'});m.classList.remove('pulse');void m.offsetWidth;m.classList.add('pulse')}return}
 if(b.dataset.cand!=null){s.cand=+b.dataset.cand;render();return}
 if(b.dataset.on!=null){d.tasks[+b.dataset.on].on=b.checked;render();return}
 const a=b.dataset.act;if(!a)return;e.preventDefault();
 const mName=()=>d.candidates?d.candidates[s.cand]?.name:d.mandant?.name;
 if(a==='upload')upload();
 else if(a==='pdf'){pdf=!pdf;render()}
 else if(a==='list'){focus=false;render()}
 else if(a==='manual'){s.mode='manual';render()}
 else if(a==='cancel'){s.mode='proposal';render()}
 else if(a==='retry'){toast('Analyse neu gestartet')}
 else if(a==='accept'){
  if(missing(d).length){s.err=true;render();jumpTo(missing(d)[0].key);return}
  const on=d.tasks.filter(t=>t.on);s.created=on.map(t=>({title:t.title,sub:`${mName()} · ${t.fristKind==='relative'?'Frist '+s.frist:t.frist?'Frist '+t.frist:'ohne Frist'}`}));
  s.mode='done';s.undo=true;toast(`${on.length?(on.length===1?'1 Aufgabe erstellt':on.length+' Aufgaben erstellt'):'Abgelegt'}: ${esc(d.sender)} <button class="btn-link" data-act="undo">Rückgängig</button>`,d.id);
 }
 else if(a==='create'){s.created=[{title:document.getElementById('m-t').value||'Aufgabe',sub:document.getElementById('m-m').value}];s.mode='done';s.undo=true;toast(`1 Aufgabe erstellt: ${esc(d.sender)} <button class="btn-link" data-act="undo">Rückgängig</button>`,d.id)}
 else if(a==='archive'){s.created=[];s.mode='done';s.undo=true;toast(`Abgelegt: ${esc(d.sender)} <button class="btn-link" data-act="undo">Rückgängig</button>`,d.id)}
 else if(a==='undo'){const id=b.closest('.toast')?toastId:d.id,u=S(id);u.mode='proposal';u.undo=false;u.created=null;sel=id;toastT=null;clearTimeout(toast.t);render()}
});
app.addEventListener('input',e=>{if(/^m-[a-z]$/.test(e.target.id)){(S(sel).form??={})[e.target.id]=e.target.value;return}if(e.target.matches('[data-frist]')){const s=S(sel);s.frist=e.target.value;
 const v=/^\d{2}\.\d{2}\.\d{4}$/.test(s.frist);if(v||!s.frist){const pos=e.target.selectionStart;render();const i=document.querySelector('[data-frist]');i.focus();i.setSelectionRange(pos,pos)}}});
function bindDrop(){const z=document.getElementById('drop');if(!z)return;
 z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');upload()}}
render();
</script>
</body>
</html>
