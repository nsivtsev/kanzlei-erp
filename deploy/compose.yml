name: ${PROJECT_NAME:-kanzlei-production}

x-app: &app
  image: ${APP_IMAGE:?Provide the tested image digest}
  platform: ${PLATFORM:-linux/amd64}
  restart: unless-stopped
  init: true
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    restart: unless-stopped
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in production.env}
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - db-data:/var/lib/mysql
    logging: *logging

  redis-cache:
    image: redis:8.6-alpine@sha256:ac2da09bc822f325a9f68f533120b86fa39c1b8db46b3aa7c1bbea7fdfd4fcba
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  redis-queue:
    image: redis:8.6-alpine@sha256:ac2da09bc822f325a9f68f533120b86fa39c1b8db46b3aa7c1bbea7fdfd4fcba
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - redis-queue-data:/data
    logging: *logging

  configurator:
    <<: *app
    restart: "no"
    entrypoint: [bash, -euc]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  backend:
    <<: *app

  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?Set SITE_NAME}
      CLIENT_MAX_BODY_SIZE: 100m
      PROXY_READ_TIMEOUT: "120"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"

  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  queue-short:
    <<: *app
    command: [bench, worker, --queue, "short,default"]

  queue-long:
    <<: *app
    command: [bench, worker, --queue, "long,default,short"]

  scheduler:
    <<: *app
    command: [bench, schedule]

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  sites:
  logs:
  redis-queue-data:
  caddy-data:
  caddy-config:
