name: ${PROJECT_NAME:-kanzlei-production}

x-app: &app
  image: ${APP_IMAGE:?Provide the tested image digest}
  platform: ${PLATFORM:-linux/amd64}
  restart: unless-stopped
  init: true
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    restart: unless-stopped
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in production.env}
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - db-data:/var/lib/mysql
    logging: *logging

  redis-cache:
    image: redis:8.6-alpine@sha256:ac2da09bc822f325a9f68f533120b86fa39c1b8db46b3aa7c1bbea7fdfd4fcba
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  redis-queue:
    image: redis:8.6-alpine@sha256:ac2da09bc822f325a9f68f533120b86fa39c1b8db46b3aa7c1bbea7fdfd4fcba
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - redis-queue-data:/data
    logging: *logging

  configurator:
    <<: *app
    restart: "no"
    entrypoint: [bash, -euc]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  backend:
    <<: *app

  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    # Nginx resolves upstream names when it starts. After a stop/restore Docker
    # may assign new IPs, so both upstream endpoints must be registered first.
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?Set SITE_NAME}
      CLIENT_MAX_BODY_SIZE: 100m
      PROXY_READ_TIMEOUT: "120"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"

  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  queue-short:
    <<: *app
    command: [bench, worker, --queue, "short,default"]

  queue-long:
    <<: *app
    command: [bench, worker, --queue, "long,default,short"]

  scheduler:
    <<: *app
    command: [bench, schedule]

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  ai-postgres:
    image: postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    profiles: [ai]
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanzlei_ai
      POSTGRES_DB: kanzlei_ai
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-}
    volumes:
      - ai-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  ai-redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    profiles: [ai]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - ai-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  ai-qdrant:
    image: qdrant/qdrant:latest@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ai-qdrant-data:/qdrant/storage
    logging: *logging

  ai-api:
    image: ${AI_API_IMAGE:-kanzlei-ai-disabled:local}
    profiles: [ai]
    restart: unless-stopped
    init: true
    environment: &ai-environment
      AI_DATABASE_URL: postgresql://kanzlei_ai@ai-postgres:5432/kanzlei_ai
      AI_DATABASE_PASSWORD: ${AI_POSTGRES_PASSWORD:-}
      AI_QDRANT_URL: http://ai-qdrant:6333
      AI_REDIS_URL: redis://ai-redis:6379/0
      AI_ERP_BASE_URL: http://frontend:8080
      AI_ERP_SITE_NAME: ${SITE_NAME:-}
      AI_ERP_ALLOW_INSECURE_HTTP: "true"
      AI_ERP_SERVICE_KEY: ${AI_ERP_SERVICE_KEY:-}
      AI_INGESTION_ENABLED: ${AI_INGESTION_ENABLED:-false}
      AI_INGESTION_KEY: ${AI_INGESTION_KEY:-}
      AI_INGESTION_PIPELINE_VERSION: ${AI_INGESTION_PIPELINE_VERSION:-pdf-native-v1}
      AI_ARTIFACT_S3_ENDPOINT: ${AI_ARTIFACT_S3_ENDPOINT:-}
      AI_ARTIFACT_S3_BUCKET: ${AI_ARTIFACT_S3_BUCKET:-}
      AI_ARTIFACT_S3_ACCESS_KEY: ${AI_ARTIFACT_S3_ACCESS_KEY:-}
      AI_ARTIFACT_S3_SECRET_KEY: ${AI_ARTIFACT_S3_SECRET_KEY:-}
      AI_ARTIFACT_S3_REGION: ${AI_ARTIFACT_S3_REGION:-us-east-1}
      AI_ARTIFACT_S3_PREFIX: ${AI_ARTIFACT_S3_PREFIX:-kanzlei-ai}
      AI_ARTIFACT_MAX_BYTES: ${AI_ARTIFACT_MAX_BYTES:-4194304}
    ports:
      - "127.0.0.1:${AI_API_PORT:-8180}:8000"
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
      ai-qdrant:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=32).close()"]
      interval: 10s
      timeout: 35s
      retries: 6
      start_period: 10s
    logging: *logging

  ai-worker:
    image: ${AI_WORKER_IMAGE:-kanzlei-ai-disabled:local}
    profiles: [ai]
    restart: unless-stopped
    init: true
    environment: *ai-environment
    hostname: ai-worker
    command: [celery, -A, "kanzlei_ai.worker:app", worker, "--hostname=worker@%h", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
      ai-qdrant:
        condition: service_started
    logging: *logging

  ai-coordinator:
    image: ${AI_API_IMAGE:-kanzlei-ai-disabled:local}
    profiles: [ai]
    restart: unless-stopped
    init: true
    environment: *ai-environment
    command: [python, -m, kanzlei_ai.coordinator, run]
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  sites:
  logs:
  redis-queue-data:
  caddy-data:
  caddy-config:
  ai-postgres-data:
  ai-redis-data:
  ai-qdrant-data:
